[package]
name = "agent-room-desktop"
version = "0.1.20"
edition = "2021"
description = "Agent Room Desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "webview-data-url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
