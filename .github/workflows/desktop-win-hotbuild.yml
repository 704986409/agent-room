# Artifact-only Windows desktop binary for hot-replace. Does NOT create a GitHub Release.
name: Desktop Windows hotbuild (artifact only)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  NODE_DIST_VERSION: '22.23.4'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout forked MCP
        uses: actions/checkout@v4
        with:
          repository: 704986409/agent-room-mcp
          ref: feat/stop-hook-one-round
          path: agent-room-mcp
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache bundled Node runtime
        uses: actions/cache@v4
        with:
          path: desktop/.cache/node-runtime
          key: node-runtime-${{ env.NODE_DIST_VERSION }}-${{ runner.os }}-x64
      - name: Cache MCP npm
        uses: actions/cache@v4
        with:
          path: agent-room-mcp/node_modules
          key: mcp-npm-${{ hashFiles('agent-room-mcp/package-lock.json') }}
      - name: Cache wake-agent npm
        uses: actions/cache@v4
        with:
          path: tools/wake-agent/node_modules
          key: wake-agent-npm-${{ hashFiles('tools/wake-agent/package-lock.json') }}-${{ runner.os }}
      - name: Build Windows (NSIS for embedded resources; we extract exe)
        shell: pwsh
        env:
          AGENT_ROOM_MCP_SRC: ${{ github.workspace }}/agent-room-mcp
        run: |
          npm ci
          npm ci --prefix tools/wake-agent
          Set-Location desktop
          npm ci
          npm run package:windows
          if (-not (Test-Path mcp-runtime/dist/index.js)) { throw "mcp-runtime/dist/index.js missing" }
          if (-not (Test-Path src-tauri/target/release/agent-room-desktop.exe)) { throw "release exe missing" }
      - name: Collect hot-replace assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-hot | Out-Null
          Copy-Item desktop/src-tauri/target/release/agent-room-desktop.exe dist-hot/
          # Also keep NSIS in case extract needed; not published as release.
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe dist-hot/ -ErrorAction SilentlyContinue
          Get-ChildItem dist-hot | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-hotbuild
          path: dist-hot/*
          retention-days: 3
